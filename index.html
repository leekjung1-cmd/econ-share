<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EFEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
<title>경제뉴스 같이 보기</title>
<style>
  :root {
    --bg: #EFEFF1; --card: #ffffff; --ink: #18191C; --sub: #8A8D94; --tx2: #5E6168; --line: #E6E6EA; --soft: #F3F3F5;
    --navy: #1E2733; --blue: #3A5A8C; --easy: #FFF5D1; --mine: #EAF6EE; --red: #c0392b; --gold: #C98F00; --bee: #F4B400;
    --hl: rgba(244, 180, 0, .28); --pill: #1E2733; --pill-tx: #fff;
    --sh: 0 1px 2px rgba(20,22,30,.04), 0 6px 18px rgba(20,22,30,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111215; --card: #1C1D21; --ink: #EDEDF0; --sub: #7A7C84; --tx2: #A6A8AF; --line: #2C2D33; --soft: #232429;
      --navy: #E9ECF2; --blue: #A9B6CC; --easy: #3A3216; --mine: #17291E; --red: #f87171; --gold: #F4B400;
      --hl: rgba(244, 180, 0, .22); --pill: #E9ECF2; --pill-tx: #16181C;
      --sh: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Noto Sans KR", "Malgun Gothic", sans-serif;
         font-size: 15.5px; line-height: 1.7; letter-spacing: -.01em; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; letter-spacing: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
           -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 14px 16px 10px; }
  header h1 { max-width: 728px; margin: 0 auto 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
              font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  header h1 span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header select { flex: none; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--card); border: 0; border-radius: 999px;
                  padding: 8px 12px; box-shadow: var(--sh); max-width: 48%; }
  nav { max-width: 728px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: 1; white-space: nowrap; background: var(--card); border: 0; color: var(--tx2); font-size: 14.5px; font-weight: 600;
               padding: 9px 12px; border-radius: 999px; box-shadow: var(--sh); }
  nav button.on { background: var(--pill); color: var(--pill-tx); font-weight: 700; }
  main { padding: 6px 16px 48px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 0; border-radius: 22px; margin: 0 0 12px; overflow: hidden; box-shadow: var(--sh); }
  .head { padding: 16px 18px; cursor: pointer; }
  .meta { color: var(--sub); font-size: 12.5px; font-weight: 500; }
  .ttl { font-weight: 700; font-size: 16.5px; line-height: 1.45; margin-top: 4px; word-break: keep-all; letter-spacing: -.02em; }
  .badge { display: inline-block; vertical-align: 2px; font-size: 11.5px; font-weight: 700; color: var(--ink); background: var(--soft);
           border-radius: 999px; padding: 1px 9px; margin-left: 6px; letter-spacing: 0; }
  .body { display: none; padding: 2px 18px 18px; }
  .card.open .body { display: block; }
  .card.open > .head .ttl { font-size: 18px; }
  h3 { font-size: 13.5px; font-weight: 800; color: var(--sub); margin: 22px 0 6px; letter-spacing: 0; }
  .one { background: var(--pill); color: var(--pill-tx); font-weight: 700; font-size: 16px; line-height: 1.55; padding: 14px 16px; border-radius: 18px; margin-top: 6px; word-break: keep-all; }
  .easy { background: var(--easy); padding: 12px 16px; border-radius: 18px; }
  .mine { background: var(--mine); padding: 10px 16px; border-radius: 18px; }
  p { margin: 0 0 8px; word-break: keep-all; overflow-wrap: anywhere; }
  ul { margin: 0; padding-left: 20px; } li { margin-bottom: 5px; word-break: keep-all; }
  b.k { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 58%, var(--hl) 58%); }
  .chain { font-weight: 700; } .chain .ar { color: var(--gold); } .why { color: var(--tx2); margin-left: 12px; font-size: 14.5px; }
  .term { border-top: 1px solid var(--line); padding: 10px 0; } .term:first-child { border-top: 0; }
  .term .tn { font-weight: 800; color: var(--ink); } .term .tc { color: var(--sub); font-size: 13.5px; }
  .small { color: var(--sub); font-size: 12.5px; }
  a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .btn { display: inline-block; padding: 9px 16px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 700; margin: 14px 6px 0 0;
         background: var(--soft); color: var(--ink); }
  .tl { border-left: 2px solid var(--bee); padding-left: 12px; margin: 8px 0 12px 2px; }
  .tl .d { color: var(--ink); font-weight: 800; font-size: 13.5px; }
  .empty { color: var(--sub); text-align: center; padding: 48px 0; }
  #lock { max-width: 380px; margin: 16vh auto 0; padding: 0 20px; text-align: center; }
  #lock input { width: 100%; font-size: 17px; padding: 14px 18px; border: 1.5px solid transparent; border-radius: 20px; margin: 18px 0 10px;
                background: var(--card); color: var(--ink); box-shadow: var(--sh); outline: none; }
  #lock input:focus { border-color: var(--pill); }
  #lock button { width: 100%; font-size: 16px; font-weight: 700; padding: 15px; border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-tx); }
  #err { color: var(--red); min-height: 1.4em; margin-top: 8px; }
  .star { color: var(--bee); }
  .srch { width: 100%; font-size: 15.5px; padding: 12px 16px; border: 1.5px solid transparent; border-radius: 20px; background: var(--card); color: var(--ink);
          box-shadow: var(--sh); outline: none; }
  .srch:focus { border-color: var(--pill); }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar .srch { flex: 1; min-width: 0; }
  .pbtn { border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-tx); font-size: 15px; font-weight: 700; padding: 12px 18px; white-space: nowrap; }
  .gbtn { border: 0; border-radius: 999px; background: var(--soft); color: var(--ink); font-size: 15px; font-weight: 600; padding: 12px 10px; white-space: nowrap; }
  .gbtn:disabled { opacity: .45; }
  .q { background: var(--card); border-radius: 22px; padding: 20px 18px; box-shadow: var(--sh); }
  .q .ask { color: var(--sub); font-size: 13.5px; font-weight: 600; }
  .q .mean { font-size: 17px; margin: 8px 0 14px; word-break: keep-all; }
  .q .hint { text-align: center; font-size: 26px; letter-spacing: 8px; color: var(--gold); font-weight: 800; margin: 4px 0 12px; }
  .q .row { display: flex; gap: 8px; margin-top: 12px; } .q .row button { flex: 1; }
  .q .srch { background: var(--soft); box-shadow: none; }
  .rq { display: inline-block; margin-top: 10px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-tx); font-size: 13.5px; font-weight: 700; }
  .rq:disabled { background: var(--soft); color: var(--tx2); }
  .res-ok { color: #15803d; font-weight: 800; } .res-no { color: var(--red); font-weight: 800; }
</style>
</head>
<body>
<div id="lock">
  <div style="font-size:26px;font-weight:800;letter-spacing:-.03em">경제뉴스 같이 보기</div>
  <div class="small">비밀번호를 넣으면 이 휴대폰에서 기억해요.</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button id="go">열기</button>
  <div id="err"></div>
</div>
<div id="app" hidden>
  <header>
    <h1><span>경제뉴스</span><select id="day"></select></h1>
    <nav>
      <button data-t="news" class="on">주요 뉴스</button>
      <button data-t="hl">헤드라인</button>
      <button data-t="fol">따라가기</button>
      <button data-t="term">용어</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

let DATA = null, TAB = "news", DAY = 0;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = (s) => esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b class="k">$1</b>').replace(/\*([^*\n]+)\*/g, '<b class="k">$1</b>');
const paras = (s) => String(s || "").split("\n").filter((x) => x.trim()).map((x) => "<p>" + rich(x.trim()) + "</p>").join("");
const bullets = (s) => { const it = String(s || "").split("\n").map((x) => x.trim().replace(/^[-•*]\s*/, "")).filter(Boolean);
  return it.length ? "<ul>" + it.map((x) => "<li>" + rich(x) + "</li>").join("") + "</ul>" : ""; };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryOpen(pw, quiet) {
  if (!(window.crypto && crypto.subtle)) { $("#err").textContent = "이 브라우저에서는 열 수 없어요 (https 주소로 열어 주세요)."; return; }
  try {
    DATA = await unlock(pw);
    try { localStorage.setItem("econ_pw", pw); } catch (e) {}
    $("#lock").hidden = true; $("#app").hidden = false;
    $("#day").innerHTML = DATA.days.map((d, i) => `<option value="${i}">${esc(d.day)}</option>`).join("");
    if (["news", "hl", "fol", "term"].includes(POS.tab)) TAB = POS.tab;
    if (POS.made === DATA.made) {                        // 새로 올라온 게 없으면 보던 날짜로, 있으면 최신 날짜로
      const k = DATA.days.findIndex((d) => d.day === POS.day);
      if (k >= 0) DAY = k;
    }
    $("#day").value = String(DAY);
    render();
    loadReq();
  } catch (e) {
    if (!quiet) $("#err").textContent = "비밀번호가 맞지 않아요.";
    try { localStorage.removeItem("econ_pw"); } catch (e2) {}
  }
}
$("#go").onclick = () => tryOpen($("#pw").value);
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryOpen($("#pw").value); });
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  if (b.dataset.t === TAB) return;
  savePos(); TAB = b.dataset.t; render();
});
$("#day").onchange = (e) => { savePos(); DAY = +e.target.value; render(); };

/* ── 읽던 자리 기억: 탭(+날짜)마다 내려간 위치와 펼친 카드. 이 휴대폰에만 저장 */
let POS = {};
try { POS = JSON.parse(localStorage.getItem("econ_pos") || "{}") || {}; } catch (e) { POS = {}; }
const posKey = () => (TAB === "fol" || TAB === "term") ? TAB : TAB + "|" + ((DATA.days[DAY] || {}).day || "");
function savePos() {
  if (!DATA || (TAB === "term" && QZ)) return;
  const open = [...document.querySelectorAll("#main .card.open")].map((c) => c.dataset.k).filter(Boolean);
  const v = POS.v || (POS.v = {});
  delete v[posKey()];
  v[posKey()] = { y: Math.round(window.scrollY), open };
  POS.tab = TAB; POS.day = (DATA.days[DAY] || {}).day || ""; POS.made = DATA.made;
  const keys = Object.keys(v);                          // 오래된 기록은 정리 (최근 40개만)
  if (keys.length > 40) keys.slice(0, keys.length - 40).forEach((k) => delete v[k]);
  try { localStorage.setItem("econ_pos", JSON.stringify(POS)); } catch (e) {}
}
function restorePos() {
  const p = (POS.v || {})[posKey()];
  const cards = [...document.querySelectorAll("#main .card")];
  if (p && p.open) p.open.forEach((k) => { const c = cards.find((x) => x.dataset.k === k); if (c) c.classList.add("open"); });
  window.scrollTo(0, p ? p.y : 0);
}
function tog(head) { head.parentNode.classList.toggle("open"); savePos(); }
let scT = null;
window.addEventListener("scroll", () => { clearTimeout(scT); scT = setTimeout(savePos, 300); }, { passive: true });
window.addEventListener("pagehide", savePos);
document.addEventListener("visibilitychange", () => { if (document.hidden) savePos(); });

function histHtml(h) {
  if (!h) return "";
  const items = h.items || [];
  const refs = (t) => (t.match(/\d+/g) || []).map((n) => +n).filter((k) => k >= 1 && k <= items.length)
    .map((k) => `<a href="${esc(items[k - 1].url)}" target="_blank" rel="noopener">[${k}]</a>`).join(" ");
  const rows = String(h.sec["흐름"] || "").split("\n").filter((x) => x.trim()).map((line) => {
    const c = line.trim().replace(/^[-•*]\s*/, "").split("|").map((x) => x.trim());
    return `<div class="tl"><div class="d">${esc(c[0])}</div><div>${rich(c[1] || line)} <span class="small">${refs(c[2] || "")}</span></div></div>`;
  }).join("");
  return `<h3>이 사건은 어떻게 여기까지 왔나</h3>${rows}` +
    (h.sec["정리"] ? `<h3>그래서 이번 일은</h3><div class="easy">${paras(h.sec["정리"])}</div>` : "") +
    (h.sec["앞으로"] ? `<h3>앞으로</h3>${bullets(h.sec["앞으로"])}` : "");
}

function anHtml(an) {
  let body = "";
  {
    body += `<div class="one">${rich(an["한줄"])}</div>`;
    if (an["쉽게"]) body += `<h3>쉽게 말하면</h3><div class="easy">${paras(an["쉽게"])}</div>`;
    if (an["요약"]) body += `<h3>기사 요약</h3>${paras(an["요약"])}` +
      (an.n_body ? `<div class="small">원문 ${an.n_body.toLocaleString()}자 → 요약 ${an.n_sum.toLocaleString()}자</div>` : "");
    if (an["배경"]) body += `<h3>배경</h3>${paras(an["배경"])}`;
    if (an["인과"]) body += "<h3>왜 이렇게 되나</h3>" + an["인과"].split("\n").filter((x) => x.trim()).map((l) =>
      (/^\s/.test(l) || l.indexOf("→") < 0) ? `<p class="why">${rich(l.trim())}</p>`
        : `<p class="chain">${l.split("→").map((x) => rich(x.trim().replace(/^-\s*/, ""))).join(' <span class="ar">→</span> ')}</p>`).join("");
    if (an.terms && an.terms.length) body += "<h3>핵심 용어</h3>" + an.terms.map((t) =>
      `<div class="term"><span class="tn">${esc(t[0])}</span><div>${rich(t[1])}</div>${t[2] ? `<div class="tc">이 기사에서: ${rich(t[2])}</div>` : ""}</div>`).join("");
    if (an["나와"]) body += `<h3>나와 무슨 상관?</h3><div class="mine">${bullets(an["나와"])}</div>`;
    if (an["볼점"]) body += `<h3>앞으로 볼 점</h3>${bullets(an["볼점"])}`;
  }
  return body;
}

function articleHtml(a, i) {
  const an = a.an;
  let body = an ? anHtml(an) : `<p class="small" style="margin-top:12px">아직 분석하지 않은 기사예요.</p>${reqBtn(a.id, (DATA.days[DAY] || {}).day, a.title)}`;
  body += histHtml(a.hist);
  body += `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>`;
  return `<div class="card" data-k="n:${esc(a.id)}"><div class="head" onclick="tog(this)">
    <div class="meta">${esc(a.press)} · ${esc(a.page)}면${a.cover ? ` · 다른 신문 ${a.cover}곳도 다룸` : ""}</div>
    <div class="ttl">${esc(a.title)}${an ? '<span class="badge">분석</span>' : ""}${a.hist ? '<span class="badge">지난 이야기</span>' : ""}</div>
  </div><div class="body">${body}</div></div>`;
}

function render() {
  const d = DATA.days[DAY] || { picked: [], headlines: [] };
  $("#day").style.visibility = (TAB === "fol" || TAB === "term") ? "hidden" : "visible";
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x.dataset.t === TAB));
  if (TAB === "term") { renderTerms(); return; }
  let h = "";
  if (TAB === "news") {
    h = d.picked.length ? `<p class="small">눌러서 펼쳐 보세요 · ${esc(DATA.made)} 기준</p>` + d.picked.map(articleHtml).join("")
      : `<div class="empty">이날 주요 뉴스가 없어요.</div>`;
  } else if (TAB === "hl") {
    h = d.headlines && d.headlines.length
      ? `<p class="small">신문 2곳 이상이 함께 다룬 사건 ${d.headlines.length}개 · <span class="star">★</span> = 주요 뉴스에 든 사건</p>` +
        d.headlines.map((x, i) => `<div class="card" data-k="h:${esc(x.rep_id || i)}"><div class="head"${x.an ? ' onclick="tog(this)"' : ' style="cursor:default"'}>
          <div class="ttl">${i + 1}. ${x.star ? '<span class="star">★ </span>' : ""}${esc(x.title)}${x.an ? '<span class="badge">분석</span>' : ""}</div>
          <div class="meta">${x.presses.length}곳: ${esc(x.presses.join(", "))}</div>
          <p style="margin:6px 0 0">${rich(x.expl)}</p>${x.an ? "" : reqBtn(x.rep_id, d.day, x.title)}</div>${x.an ? `<div class="body">${anHtml(x.an)}${x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>` : ""}</div>` : ""}</div>`).join("")
      : `<div class="empty">이날 헤드라인 설명이 아직 없어요.</div>`;
  } else {
    h = (DATA.follows || []).length ? DATA.follows.map((f, i) => {
      let day = "", list = "";
      f.hits.forEach((x) => {
        if (x.day !== day) { day = x.day; list += `<h3>${esc(day)}</h3>`; }
        list += `<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="small">${esc(x.press)}</span></p>`;
      });
      return `<div class="card" data-k="f:${esc(f.name)}"><div class="head" onclick="tog(this)">
        <div class="ttl">${esc(f.name)}</div><div class="meta">키워드: ${esc(f.keywords)} · 기사 ${f.hits.length}건</div></div>
        <div class="body">${f.hist ? histHtml({ sec: f.hist, items: [] }) : ""}${list || '<p class="small">아직 기사가 없어요.</p>'}</div></div>`;
    }).join("") : `<div class="empty">따라가는 사건이 없어요.</div>`;
  }
  $("#main").innerHTML = h;
  restorePos();
}

/* ── 분석 요청: 누르면 Supabase에 쌓이고, PC가 5분마다 가져가 분석한 뒤 이 페이지를 다시 올림 */
let REQ = {};                                            // aid → 상태 (new/working/done/fail)
const REQ_TXT = { new: "요청함 · PC가 곧 분석해요", working: "PC가 분석하는 중…", done: "분석 끝 · 몇 분 뒤 새로고침", fail: "분석 못 함 (사진 기사 등)" };
function reqBtn(aid, day, title) {
  if (!DATA.req || !aid) return "";
  const st = REQ[aid];
  return `<div><button class="rq" data-aid="${esc(aid)}" data-day="${esc(day || "")}" data-title="${esc(title)}"
    onclick="event.stopPropagation(); askReq(this)"${st && st !== "fail" ? " disabled" : ""}>${st ? REQ_TXT[st] : "분석 요청"}</button></div>`;
}
async function rpc(fn, args) {
  const r = await fetch(DATA.req.url + "/rest/v1/rpc/" + fn, { method: "POST",
    headers: { apikey: DATA.req.anon, Authorization: "Bearer " + DATA.req.anon, "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ p_key: DATA.req.key }, args)) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function askReq(b) {
  b.disabled = true; b.textContent = "보내는 중…";
  try {
    const res = await rpc("econ_req_add", { p_aid: b.dataset.aid, p_day: b.dataset.day, p_title: b.dataset.title });
    if (res === "limit") { b.textContent = "오늘 요청이 너무 많아요"; return; }
    REQ[b.dataset.aid] = "new"; b.textContent = REQ_TXT.new;
  } catch (e) { b.disabled = false; b.textContent = "못 보냈어요 · 다시 누르기"; }
}
async function loadReq() {
  if (!DATA.req) return;
  try {
    const rows = await rpc("econ_req_list", {});
    REQ = {}; (rows || []).forEach((r) => { REQ[r.aid] = r.status; });
    document.querySelectorAll("button.rq").forEach((b) => {
      const st = REQ[b.dataset.aid];
      if (st) { b.textContent = REQ_TXT[st]; b.disabled = st !== "fail"; }
    });
  } catch (e) {}
}

/* ── 용어 탭: 경제용어 수첩 보기 + 주관식 문제 (힌트 = 초성) */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = (w) => [...w].map((ch) => { const c = ch.charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? CHO[Math.floor((c - 0xAC00) / 588)] : ch; }).join("");
const names = (t) => { const m = t.match(/^(.+?)\s*\((.+)\)\s*$/); return m ? [t, m[1].trim(), m[2].trim()] : [t]; };
const norm = (x) => String(x).replace(/[\s·\-_()]/g, "").toLowerCase();
let QZ = null, TQ = "";
let QREC = {};
try { QREC = JSON.parse(localStorage.getItem("econ_quiz") || "{}") || {}; } catch (e) { QREC = {}; }

function renderTerms() {
  if (QZ) { renderQuiz(); return; }
  const T = DATA.terms || [];
  $("#main").innerHTML = T.length
    ? `<div class="bar"><input class="srch" id="tq" placeholder="용어 찾기" value="${esc(TQ)}"><button class="pbtn" id="qstart">문제 풀기</button></div>
       <p class="small" id="tcount"></p><div class="card"><div class="head" style="cursor:default" id="tlist"></div></div>`
    : `<div class="empty">수첩에 용어가 아직 없어요.</div>`;
  if (!T.length) return;
  const fill = () => {
    const q = norm(TQ);
    const L = T.filter((t) => !q || norm(t.term + t.meaning).includes(q));
    $("#tcount").textContent = q ? `${L.length}개 찾음 (모두 ${T.length}개)` : `경제용어 수첩 ${T.length}개`;
    $("#tlist").innerHTML = L.map((t) => {
      const r = QREC[t.term];
      return `<div class="term"><span class="tn">${esc(t.term)}</span>${r ? ` <span class="small">맞힘 ${r[0]} · 틀림 ${r[1]}</span>` : ""}
        <div>${rich(t.meaning)}</div>${t.from ? `<div class="tc">${esc(t.day)} · ${esc(t.from)}</div>` : ""}</div>`;
    }).join("") || '<p class="small">맞는 용어가 없어요.</p>';
  };
  fill();
  $("#tq").oninput = (e) => { TQ = e.target.value; fill(); };
  $("#qstart").onclick = startQuiz;
  restorePos();
}
function startQuiz() {
  savePos();
  const T = (DATA.terms || []).slice();
  for (let i = T.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [T[i], T[j]] = [T[j], T[i]]; }
  const sc = (t) => { const r = QREC[t.term] || [0, 0]; return r[0] - r[1]; };
  T.sort((a, b) => sc(a) - sc(b));                       // 덜 맞힌 용어 먼저
  QZ = { cards: T.slice(0, 10), i: 0, ok: 0, wrong: [], hinted: false, answered: null };
  window.scrollTo(0, 0);
  renderQuiz();
}
function quitQuiz() { QZ = null; render(); }
function renderQuiz() {
  const z = QZ;
  if (z.i >= z.cards.length) {
    $("#main").innerHTML = `<div class="q"><h3 style="margin-top:0">끝!</h3><p>${z.cards.length}개 중 ${z.ok}개 맞혔어요.</p>
      ${z.wrong.length ? `<p class="res-no">다시 볼 용어: ${z.wrong.map(esc).join(", ")}</p>` : ""}
      <div class="row"><button class="pbtn" id="again">한 번 더</button><button class="gbtn" id="quit">용어 목록</button></div></div>`;
    $("#again").onclick = startQuiz;
    $("#quit").onclick = quitQuiz;
    return;
  }
  const t = z.cards[z.i];
  let mean = t.meaning;
  names(t.term).sort((a, b) => b.length - a.length).forEach((n) => { if (n.length >= 2) mean = mean.split(n).join("○".repeat(n.length)); });
  let res = "";
  if (z.answered) {
    res = (z.answered === "ok" ? `<p class="res-ok">정답!</p>` : `<p class="res-no">${z.answered === "give" ? "정답은" : "아쉬워요. 정답은"}</p>`) +
      `<p style="font-size:19px;font-weight:700;color:var(--blue)">${esc(t.term)}</p>` +
      (t.from ? `<p class="small">${esc(t.day)} · ${esc(t.from)}</p>` : "");
  }
  $("#main").innerHTML = `<div class="q"><div class="small" style="display:flex;justify-content:space-between"><span>${z.i + 1} / ${z.cards.length}</span><a href="#" id="qx">그만하기</a></div>
    <div class="ask" style="margin-top:6px">이 뜻에 맞는 경제 용어는?</div>
    <div class="mean">${rich(z.answered ? t.meaning : mean)}</div>
    ${z.hinted && !z.answered ? `<div class="hint">${esc(chosung(t.term))}</div>` : ""}
    ${z.answered ? res + `<div class="row"><button class="pbtn" id="next">${z.i + 1 < z.cards.length ? "다음 문제" : "결과 보기"}</button></div>`
      : `<input class="srch" id="ans" placeholder="용어를 써 보세요" autocomplete="off" autocapitalize="off" enterkeyhint="done">
         <div class="row"><button class="pbtn" id="chk">확인</button><button class="gbtn" id="hint"${z.hinted ? " disabled" : ""}>힌트 (초성)</button><button class="gbtn" id="give">모르겠어</button></div>`}
  </div>`;
  $("#qx").onclick = (e) => { e.preventDefault(); quitQuiz(); };
  if (z.answered) { $("#next").onclick = () => { z.i++; z.hinted = false; z.answered = null; renderQuiz(); }; return; }
  const ans = $("#ans");
  ans.focus();
  const judge = (txt) => {
    const ok = txt !== null && names(t.term).some((n) => n && norm(txt) === norm(n));
    const r = QREC[t.term] || [0, 0]; r[ok ? 0 : 1]++; QREC[t.term] = r;
    try { localStorage.setItem("econ_quiz", JSON.stringify(QREC)); } catch (e) {}
    if (ok) z.ok++; else z.wrong.push(t.term);
    z.answered = ok ? "ok" : (txt === null ? "give" : "no");
    renderQuiz();
  };
  $("#chk").onclick = () => { if (ans.value.trim()) judge(ans.value.trim()); };
  ans.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && ans.value.trim()) { e.preventDefault(); judge(ans.value.trim()); } });
  $("#hint").onclick = () => { z.hinted = true; const v = ans.value; renderQuiz(); $("#ans").value = v; };
  $("#give").onclick = () => judge(null);
}

(function () {
  let saved = "";
  try { saved = localStorage.getItem("econ_pw") || ""; } catch (e) {}
  if (saved) tryOpen(saved, true);
})();
</script>
</body>
</html>
