<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a68">
<title>경제뉴스 같이 보기</title>
<style>
  :root {
    --navy: #1f3a68; --blue: #2f5fb3; --ink: #1d2330; --sub: #6b7385; --line: #e3e7ef;
    --bg: #f3f5f9; --card: #ffffff; --soft: #eaf0fb; --easy: #fff8e6; --mine: #eef7f0; --red: #c0392b; --gold: #a67c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #9db8ea; --blue: #8fb0f0; --ink: #e6e9f0; --sub: #9aa3b5; --line: #2c3446;
      --bg: #12161f; --card: #1a1f2b; --soft: #1f2a40; --easy: #2e2817; --mine: #1b2b22; --red: #ff7b6b; --gold: #e0b84a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         font-size: 16px; line-height: 1.65; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: #1f3a68; color: #fff; padding: 10px 16px 0; }
  header h1 { font-size: 17px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header select { font-size: 14px; padding: 4px 6px; border-radius: 6px; border: 0; max-width: 46%; }
  nav { display: flex; gap: 2px; }
  nav button { flex: 1; background: none; border: 0; color: #b9c6e4; font-size: 15px; padding: 9px 4px 10px;
               border-bottom: 3px solid transparent; font-family: inherit; }
  nav button.on { color: #fff; border-bottom-color: #f5c542; font-weight: 700; }
  main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; overflow: hidden; }
  .head { padding: 12px 14px; cursor: pointer; }
  .meta { color: var(--sub); font-size: 13px; }
  .ttl { font-weight: 700; font-size: 16px; margin-top: 2px; word-break: keep-all; }
  .badge { display: inline-block; font-size: 12px; color: var(--blue); border: 1px solid var(--blue); border-radius: 10px; padding: 0 7px; margin-left: 4px; }
  .body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .card.open .body { display: block; }
  h3 { font-size: 15px; color: var(--navy); margin: 16px 0 4px; }
  .one { background: var(--soft); color: var(--navy); font-weight: 700; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
  .easy { background: var(--easy); padding: 10px 12px; border-radius: 8px; }
  .mine { background: var(--mine); padding: 8px 12px; border-radius: 8px; }
  p { margin: 0 0 8px; word-break: keep-all; overflow-wrap: anywhere; }
  ul { margin: 0; padding-left: 20px; } li { margin-bottom: 4px; word-break: keep-all; }
  b.k { color: var(--blue); }
  .chain { font-weight: 700; } .chain .ar { color: var(--red); } .why { color: var(--sub); margin-left: 12px; }
  .term { border-top: 1px solid var(--line); padding: 8px 0; } .term:first-child { border-top: 0; }
  .term .tn { color: var(--blue); font-weight: 700; } .term .tc { color: var(--sub); font-size: 14px; }
  .small { color: var(--sub); font-size: 13px; }
  a { color: var(--blue); text-decoration: none; }
  .btn { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; margin: 8px 6px 0 0; background: var(--card); color: var(--blue); }
  .tl { border-left: 3px solid var(--soft); padding-left: 10px; margin: 6px 0 10px; }
  .tl .d { color: var(--navy); font-weight: 700; font-size: 14px; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }
  #lock { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
  #lock input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 14px 0 10px; background: var(--card); color: var(--ink); }
  #lock button { width: 100%; font-size: 17px; padding: 12px; border: 0; border-radius: 10px; background: #1f3a68; color: #fff; }
  #err { color: var(--red); min-height: 1.4em; }
  .star { color: var(--gold); }
</style>
</head>
<body>
<div id="lock">
  <div style="font-size:22px;font-weight:700;color:var(--navy)">경제뉴스 같이 보기</div>
  <div class="small">비밀번호를 넣으면 이 휴대폰에서 기억해요.</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button id="go">열기</button>
  <div id="err"></div>
</div>
<div id="app" hidden>
  <header>
    <h1><span>경제뉴스 같이 보기</span><select id="day"></select></h1>
    <nav>
      <button data-t="news" class="on">주요 뉴스</button>
      <button data-t="hl">헤드라인</button>
      <button data-t="fol">따라가는 사건</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

let DATA = null, TAB = "news", DAY = 0;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = (s) => esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b class="k">$1</b>').replace(/\*([^*\n]+)\*/g, '<b class="k">$1</b>');
const paras = (s) => String(s || "").split("\n").filter((x) => x.trim()).map((x) => "<p>" + rich(x.trim()) + "</p>").join("");
const bullets = (s) => { const it = String(s || "").split("\n").map((x) => x.trim().replace(/^[-•*]\s*/, "")).filter(Boolean);
  return it.length ? "<ul>" + it.map((x) => "<li>" + rich(x) + "</li>").join("") + "</ul>" : ""; };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryOpen(pw, quiet) {
  if (!(window.crypto && crypto.subtle)) { $("#err").textContent = "이 브라우저에서는 열 수 없어요 (https 주소로 열어 주세요)."; return; }
  try {
    DATA = await unlock(pw);
    try { localStorage.setItem("econ_pw", pw); } catch (e) {}
    $("#lock").hidden = true; $("#app").hidden = false;
    $("#day").innerHTML = DATA.days.map((d, i) => `<option value="${i}">${esc(d.day)}</option>`).join("");
    render();
  } catch (e) {
    if (!quiet) $("#err").textContent = "비밀번호가 맞지 않아요.";
    try { localStorage.removeItem("econ_pw"); } catch (e2) {}
  }
}
$("#go").onclick = () => tryOpen($("#pw").value);
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryOpen($("#pw").value); });
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  TAB = b.dataset.t; document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  render(); window.scrollTo(0, 0);
});
$("#day").onchange = (e) => { DAY = +e.target.value; render(); window.scrollTo(0, 0); };

function histHtml(h) {
  if (!h) return "";
  const items = h.items || [];
  const refs = (t) => (t.match(/\d+/g) || []).map((n) => +n).filter((k) => k >= 1 && k <= items.length)
    .map((k) => `<a href="${esc(items[k - 1].url)}" target="_blank" rel="noopener">[${k}]</a>`).join(" ");
  const rows = String(h.sec["흐름"] || "").split("\n").filter((x) => x.trim()).map((line) => {
    const c = line.trim().replace(/^[-•*]\s*/, "").split("|").map((x) => x.trim());
    return `<div class="tl"><div class="d">${esc(c[0])}</div><div>${rich(c[1] || line)} <span class="small">${refs(c[2] || "")}</span></div></div>`;
  }).join("");
  return `<h3>이 사건은 어떻게 여기까지 왔나</h3>${rows}` +
    (h.sec["정리"] ? `<h3>그래서 이번 일은</h3><div class="easy">${paras(h.sec["정리"])}</div>` : "") +
    (h.sec["앞으로"] ? `<h3>앞으로</h3>${bullets(h.sec["앞으로"])}` : "");
}

function articleHtml(a, i) {
  const an = a.an;
  let body = "";
  if (an) {
    body += `<div class="one">${rich(an["한줄"])}</div>`;
    if (an["쉽게"]) body += `<h3>쉽게 말하면</h3><div class="easy">${paras(an["쉽게"])}</div>`;
    if (an["요약"]) body += `<h3>기사 요약</h3>${paras(an["요약"])}` +
      (an.n_body ? `<div class="small">원문 ${an.n_body.toLocaleString()}자 → 요약 ${an.n_sum.toLocaleString()}자</div>` : "");
    if (an["배경"]) body += `<h3>배경</h3>${paras(an["배경"])}`;
    if (an["인과"]) body += "<h3>왜 이렇게 되나</h3>" + an["인과"].split("\n").filter((x) => x.trim()).map((l) =>
      (/^\s/.test(l) || l.indexOf("→") < 0) ? `<p class="why">${rich(l.trim())}</p>`
        : `<p class="chain">${l.split("→").map((x) => rich(x.trim().replace(/^-\s*/, ""))).join(' <span class="ar">→</span> ')}</p>`).join("");
    if (an.terms && an.terms.length) body += "<h3>핵심 용어</h3>" + an.terms.map((t) =>
      `<div class="term"><span class="tn">${esc(t[0])}</span><div>${rich(t[1])}</div>${t[2] ? `<div class="tc">이 기사에서: ${rich(t[2])}</div>` : ""}</div>`).join("");
    if (an["나와"]) body += `<h3>나와 무슨 상관?</h3><div class="mine">${bullets(an["나와"])}</div>`;
    if (an["볼점"]) body += `<h3>앞으로 볼 점</h3>${bullets(an["볼점"])}`;
  } else {
    body += `<p class="small" style="margin-top:12px">아직 분석하지 않은 기사예요.</p>`;
  }
  body += histHtml(a.hist);
  body += `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>`;
  return `<div class="card" id="a${i}"><div class="head" onclick="this.parentNode.classList.toggle('open')">
    <div class="meta">${esc(a.press)} · ${esc(a.page)}면${a.cover ? ` · 다른 신문 ${a.cover}곳도 다룸` : ""}</div>
    <div class="ttl">${esc(a.title)}${an ? '<span class="badge">분석</span>' : ""}${a.hist ? '<span class="badge">지난 이야기</span>' : ""}</div>
  </div><div class="body">${body}</div></div>`;
}

function render() {
  const d = DATA.days[DAY] || { picked: [], headlines: [] };
  $("#day").style.visibility = TAB === "fol" ? "hidden" : "visible";
  let h = "";
  if (TAB === "news") {
    h = d.picked.length ? `<p class="small">눌러서 펼쳐 보세요 · ${esc(DATA.made)} 기준</p>` + d.picked.map(articleHtml).join("")
      : `<div class="empty">이날 주요 뉴스가 없어요.</div>`;
  } else if (TAB === "hl") {
    h = d.headlines && d.headlines.length
      ? `<p class="small">신문 2곳 이상이 함께 다룬 사건 ${d.headlines.length}개 · <span class="star">★</span> = 주요 뉴스에 든 사건</p>` +
        d.headlines.map((x, i) => `<div class="card"><div class="head" style="cursor:default">
          <div class="ttl">${i + 1}. ${x.star ? '<span class="star">★ </span>' : ""}${esc(x.title)}</div>
          <div class="meta">${x.presses.length}곳: ${esc(x.presses.join(", "))}</div>
          <p style="margin:6px 0 0">${rich(x.expl)}</p></div></div>`).join("")
      : `<div class="empty">이날 헤드라인 설명이 아직 없어요.</div>`;
  } else {
    h = DATA.follows.length ? DATA.follows.map((f, i) => {
      let day = "", list = "";
      f.hits.forEach((x) => {
        if (x.day !== day) { day = x.day; list += `<h3>${esc(day)}</h3>`; }
        list += `<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="small">${esc(x.press)}</span></p>`;
      });
      return `<div class="card"><div class="head" onclick="this.parentNode.classList.toggle('open')">
        <div class="ttl">${esc(f.name)}</div><div class="meta">키워드: ${esc(f.keywords)} · 기사 ${f.hits.length}건</div></div>
        <div class="body">${f.hist ? histHtml({ sec: f.hist, items: [] }) : ""}${list || '<p class="small">아직 기사가 없어요.</p>'}</div></div>`;
    }).join("") : `<div class="empty">따라가는 사건이 없어요.</div>`;
  }
  $("#main").innerHTML = h;
}

(function () {
  let saved = "";
  try { saved = localStorage.getItem("econ_pw") || ""; } catch (e) {}
  if (saved) tryOpen(saved, true);
})();
</script>
</body>
